name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # expo-router's generated route types live in .expo/, which is
      # gitignored and only produced by the dev server. Without them
      # expo-router falls back to permissive `Href` types, so this passes —
      # but it will not catch a malformed route string the way a local
      # typecheck does. Run `npx tsc --noEmit` locally after adding a route.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        # TZ pinned so timezone assertions cannot coincide with the
        # runner's zone — see jest.setup.js for why that matters.
        run: TZ=UTC npx jest --ci
